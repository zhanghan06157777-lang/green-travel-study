<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>研究者后台 · 环境识别</title><link rel="stylesheet" href="../task/style.css?v=20261102-rules1"></head>
<body><main class="page admin-page">
<div class="admin-title"><div><div class="eyebrow">仅已授权的研究者可访问数据</div><h1>环境识别 · 研究者后台</h1></div><button class="btn secondary" id="logout" hidden>退出登录</button></div>
<p id="error" class="error-text" role="alert"></p><p id="notice" class="admin-notice" role="status" aria-live="polite"></p>
<section id="login-panel" class="panel"><h2>研究者登录</h2><p class="small">请使用此实验项目中已配置的研究者账号，不是 Supabase 管理控制台的密码。</p>
<form id="login"><label>邮箱<input type="email" name="email" autocomplete="username" required></label><label>密码<input type="password" name="password" autocomplete="current-password" required></label><button class="btn primary" type="submit">登录</button></form>
<p class="small">没有账号时，请先在 Supabase 项目控制台创建研究者 Auth 用户并完成所有者绑定。仅注册普通账号不能读取记录。</p></section>
<section id="workspace" hidden><form id="filters" class="filters"><label>起始日期<input type="date" name="from"></label><label>结束日期<input type="date" name="to"></label><input name="q" aria-label="搜索随机码或编号" placeholder="搜索随机码 / 外部编号 / 内部ID"><select name="condition" aria-label="组别"><option value="">全部组别</option><option value="engagement">参与组</option><option value="completion">完成组</option></select><select name="status" aria-label="状态"><option value="">全部状态</option><option value="active">未领取</option><option value="final">已结束</option></select><button class="btn secondary">查询 / 刷新</button><button class="btn primary" type="button" id="export">导出CSV</button></form>
<div class="table-scroll"><table><thead><tr><th>随机码</th><th>外部编号</th><th>组别</th><th>状态</th><th>场景 / 圈画</th><th>奖励资格</th><th>建立时间</th><th>操作</th></tr></thead><tbody id="records"></tbody></table></div>
<div class="pager"><span id="count"></span><button class="btn secondary" id="previous">上一页</button><button class="btn secondary" id="next">下一页</button></div><section id="detail" class="admin-detail" hidden></section>
</section></main><script type="module" src="admin.mjs?v=20261102-rules1"></script></body></html>
